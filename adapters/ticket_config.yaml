task_metadata:
  task_name: "复杂客诉工单解析与打标"
  description: "将用户非结构化客诉文本解析为标准 JSON 格式，用于工单路由和评估。"

schema:
  core_intent: "string; one of: 退款纠纷, 物流投诉, 账号封禁, 系统Bug, 虚假宣传"
  urgency_level: "string; one of: 高, 中, 低"
  entities: "array; extract key entities such as order id, amount, account id; [] if none"
  summary: "string; summarize the user's core request in 20 Chinese chars or fewer"

dataset:
  path: "data/ticket_dataset.json"

evaluation:
  primary_metric: "f1_score"

runtime:
  mode: "demo"
  batch_size: 8
  max_workers: 6
  epochs: 6
  sample_size: 30
  shuffle_seed: 2026
  enable_few_shots: false
  enable_llm_scout: false
  enable_f1_postprocess: true
  enable_rule_fast_path: false
  force_evolution_demo: false
  use_rule_attributor: false
  use_rule_evolver: false
  enable_evolution: true
  reset_state: false
  execution_max_tokens_floor: 240
  execution_max_tokens_per_item: 90
  enable_cheap_json_repair: true
  enable_quality_early_stop: true
  target_f1_stop: 0.95
  target_exact_stop: 0.80

cache:
  enabled: true
  path: "memory/llm_cache.jsonl"

evolution:
  regression_mode: "sample_then_full"
  f1_tolerance: 0.02
  confidence_threshold: 0.70
  sample_size: 10
  replay_size: 20
  max_new_skill_chars: 900
  max_skills_per_category: 5
  enable_tip_memory: true
  tip_promotion_threshold: 2
  tip_immediate_confidence: 0.85
  prefer_few_shot_first: true
  allow_immediate_few_shot: true

competition:
  topic: "题目1：算法方向"
  paper_direction: "SkillOS + SkillOpt"
  method: "冻结基座模型参数，通过根因驱动动作选择器、双层记忆、技能检索、Prompt/Skill/Few-shot 联动进化、置信度门控、经验回放、拒绝编辑缓冲区、SkillRepo 去重淘汰、版本回滚和 F1 后处理提升指标，并降低 Token 消耗。短期 TipMemory 先缓冲低风险经验，只有高置信或重复出现的经验才晋升为长期 Prompt/Skill/Few-shot 资产。"
